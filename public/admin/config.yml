backend:
  name: github
  repo: ausohan161/Admission-Info
  branch: main
  # নিচের URL-টি cms-oauth/ ফোল্ডার Cloudflare Pages-এ ডিপ্লয় করার পর পাওয়া
  # ঠিকানা দিয়ে বদলে দিন (যেমন https://admission-cms-auth.pages.dev)।
  base_url: https://REPLACE-WITH-YOUR-CLOUDFLARE-PAGES-URL
  auth_endpoint: auth

publish_mode: simple
media_folder: "public/uploads"
public_folder: "/uploads"

locale: "en"


collections:
  - name: "home"
    label: "১. হোম পেজ (একনজরে ক্যালেন্ডার)"
    label_singular: "প্রতিষ্ঠান"
    folder: "src/data/universities"
    create: true
    delete: true
    slug: "{{fields.id}}"
    format: "json"
    identifier_field: "nameBn"
    summary: "{{nameBn}} ({{shortName}})"
    fields:
      - { label: "আইডি (ইংরেজি ছোট হাতের অক্ষর, সংখ্যা, হাইফেন — একবার সেভ হলে বদলাবেন না)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন"] }
      - { label: "নাম (বাংলা)", name: "nameBn", widget: "string" }
      - { label: "নাম (ইংরেজি)", name: "nameEn", widget: "string", required: false }
      - { label: "সংক্ষিপ্ত নাম (যেমন BUET, DU)", name: "shortName", widget: "string" }
      - label: "ক্যাটাগরি"
        name: "category"
        widget: "select"
        options:
          - { label: "মেডিকেল অ্যান্ড ডেন্টাল কলেজ", value: "medical" }
          - { label: "ইঞ্জিনিয়ারিং বিশ্ববিদ্যালয় (স্বতন্ত্র)", value: "engineering-independent" }
          - { label: "ইঞ্জিনিয়ারিং বিশ্ববিদ্যালয় (গুচ্ছ)", value: "engineering-cluster" }
          - { label: "সাধারণ বিশ্ববিদ্যালয় (স্বতন্ত্র)", value: "general-independent" }
          - { label: "সাধারণ বিশ্ববিদ্যালয় (গুচ্ছ)", value: "general-cluster" }
      - { label: "সাব-গ্রুপ (ঐচ্ছিক)", name: "subGroupBn", widget: "string", required: false }
      - { label: "ভর্তি সেশন (যেমন ২০২৬-২৭)", name: "admissionSession", widget: "string" }
      - label: "ইউনিট ও তারিখ"
        name: "units"
        widget: "list"
        summary: "{{fields.nameBn}}"
        fields:
          - { label: "ইউনিট আইডি (ইংরেজি; একটিমাত্র ইউনিট হলে default)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন"] }
          - { label: "ইউনিটের নাম (বাংলা) — একটিমাত্র ইউনিট হলে খালি রাখুন", name: "nameBn", widget: "string", required: false }
          - { label: "আবেদন শুরু", name: "applicationStart", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - { label: "আবেদন শেষ", name: "applicationEnd", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - { label: "ভর্তি পরীক্ষার তারিখ", name: "examDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - { label: "এটি কি নমুনা তারিখ? (সার্কুলার এলে আনচেক করুন)", name: "isDemoData", widget: "boolean", default: false, required: false }

  - name: "home_notices"
    label: "১. হোম পেজ — জরুরি নোটিশ (স্ক্রলিং)"
    label_singular: "নোটিশ"
    files:
      - name: "notices"
        label: "জরুরি নোটিশের তালিকা"
        file: "src/data/notices.json"
        fields:
          - label: "নোটিশসমূহ (প্রতিটি লাইন একটি নোটিশ)"
            name: "notices"
            widget: "list"
            field: { label: "নোটিশ", name: "notice", widget: "string" }

  - name: "info"
    label: "২. তথ্যকণিকা"
    label_singular: "প্রতিষ্ঠানের তথ্য"
    folder: "src/data/info"
    create: true
    delete: true
    slug: "{{fields.id}}"
    format: "json"
    identifier_field: "id"
    summary: "{{fields.id}}"
    fields:
      - { label: "আইডি (ইংরেজি ছোট হাতের অক্ষর, সংখ্যা, হাইফেন — একবার সেভ হলে বদলাবেন না)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন"] }
      - { label: "সংক্ষিপ্ত পরিচিতি", name: "introBn", widget: "text", required: false }
      - label: "ইউনিটের তথ্য"
        name: "units"
        widget: "list"
        summary: "{{fields.id}}"
        fields:
          - { label: "ইউনিট আইডি (ইংরেজি; একটিমাত্র ইউনিট হলে default)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন"] }
          - label: "আসন সংখ্যা"
            name: "seats"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "মোট আসন", name: "total", widget: "number", value_type: "int", required: false }
              - label: "বিভাজন"
                name: "breakdown"
                widget: "list"
                required: false
                fields:
                  - { label: "নাম", name: "nameBn", widget: "string" }
                  - { label: "সংখ্যা", name: "count", widget: "number", value_type: "int" }
          - label: "আবেদন যোগ্যতা"
            name: "eligibility"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "বিবরণ", name: "descriptionBn", widget: "text", required: false }
              - label: "পয়েন্ট"
                name: "points"
                widget: "list"
                required: false
                field: { label: "পয়েন্ট", name: "point", widget: "string" }
          - { label: "পরীক্ষার ধরন (যেমন MCQ, Written)", name: "examPattern", widget: "string", required: false }
          - label: "বিষয় ও নম্বর"
            name: "subjects"
            widget: "list"
            required: false
            fields:
              - { label: "বিষয়ের নাম", name: "nameBn", widget: "string" }
              - { label: "নম্বর", name: "marks", widget: "number", value_type: "int" }
          - { label: "ফলাফল নির্ণয় পদ্ধতি", name: "resultMethod", widget: "string", required: false }
          - { label: "সার্কুলার লিংক", name: "circularUrl", widget: "string", required: false }

  - name: "checker"
    label: "৩. আবেদনযোগ্যতা যাচাই"
    label_singular: "শর্ত"
    folder: "src/data/eligibility"
    create: true
    delete: true
    slug: "{{fields.id}}"
    format: "json"
    identifier_field: "id"
    summary: "{{fields.id}}"
    fields:
      - { label: "আইডি (ইংরেজি ছোট হাতের অক্ষর, সংখ্যা, হাইফেন — একবার সেভ হলে বদলাবেন না)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন"] }
      - label: "ইউনিটের শর্ত"
        name: "units"
        widget: "list"
        summary: "{{fields.id}}"
        fields:
          - { label: "ইউনিট আইডি (ইংরেজি; একটিমাত্র ইউনিট হলে default)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন"] }
          - label: "জিপিএ শর্ত (খালি রাখলে এই ইউনিট যাচাইয়ে আসবে না)"
            name: "eligibilityCriteria"
            widget: "object"
            required: false
            collapsed: false
            fields:
              - label: "গ্রুপ"
                name: "group"
                widget: "select"
                options:
                  - { label: "বিজ্ঞান", value: "science" }
                  - { label: "বাণিজ্য", value: "commerce" }
                  - { label: "মানবিক", value: "arts" }
                  - { label: "সব গ্রুপ", value: "any" }
              - { label: "ন্যূনতম SSC জিপিএ", name: "minSscGpa", widget: "number", value_type: "float", required: false }
              - { label: "ন্যূনতম HSC জিপিএ", name: "minHscGpa", widget: "number", value_type: "float", required: false }
              - { label: "ন্যূনতম মোট (SSC+HSC) জিপিএ", name: "minCombinedGpa", widget: "number", value_type: "float", required: false }
              - label: "বিষয়ভিত্তিক ন্যূনতম জিপিএ"
                name: "subjectMinimums"
                widget: "list"
                required: false
                fields:
                  - { label: "বিষয় (পদার্থবিজ্ঞান, রসায়ন, জীববিজ্ঞান, উচ্চতর গণিত, ইংরেজি)", name: "subjectBn", widget: "string" }
                  - { label: "ন্যূনতম জিপিএ", name: "minGpa", widget: "number", value_type: "float" }
              - label: "বিষয়সমষ্টির শর্ত (ঐচ্ছিক)"
                name: "subjectGroupMinTotal"
                widget: "object"
                required: false
                collapsed: true
                fields:
                  - label: "বিষয়সমূহ"
                    name: "subjectsBn"
                    widget: "list"
                    field: { label: "বিষয়", name: "subject", widget: "string" }
                  - { label: "মোট ন্যূনতম", name: "minTotal", widget: "number", value_type: "float" }
              - { label: "টীকা (চেকারে দেখাবে)", name: "noteBn", widget: "text", required: false }

  - name: "site_texts"
    label: "৪. সাধারণ লেখা (টাইটেল, মেনু, বাটন — সব পেজ)"
    label_singular: "লেখা"
    files:
      - name: "texts"
        label: "সাইটের সব লেখা (বাম পাশের নাম ঠিক রাখুন)"
