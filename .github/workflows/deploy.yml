name: Build and publish static site

# চলবে: main ব্রাঞ্চে push হলেই স্বয়ংক্রিয়ভাবে, অথবা GitHub-এর Actions ট্যাব থেকে
# ম্যানুয়ালি "Run workflow" চেপেও চালানো যাবে।
#
# এই workflow সাইট বিল্ড করে "deploy" ব্রাঞ্চে পুশ করে — এই ব্রাঞ্চে শুধু বিল্ড হওয়া
# plain HTML/CSS/JS থাকে (সোর্স কোড না)। cPanel-এর Git Version Control ফিচার এই
# "deploy" ব্রাঞ্চ থেকে সরাসরি সার্ভারে পুল করে সাইট লাইভ করে — কোনো FTP secret বা
# ম্যানুয়াল ফাইল আপলোডের দরকার নেই। সেটআপের ধাপ README.md-এর
# "cPanel দিয়ে সরাসরি ডিপ্লয়" অংশে আছে।
on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy ব্রাঞ্চে পুশ করতে GITHUB_TOKEN-এর write অ্যাক্সেস লাগে — কিছু
# রিপোতে এটা ডিফল্টভাবে read-only থাকে, তাই এখানে স্পষ্ট করে দেওয়া হলো।
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: রিপো checkout
        uses: actions/checkout@v4

      - name: Node.js সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ডিপেন্ডেন্সি ইনস্টল
        run: npm ci

      - name: স্ট্যাটিক সাইট বিল্ড (তৈরি হবে out/ ফোল্ডার)
        run: npm run build

      - name: cPanel deploy হুকের জন্য .cpanel.yml যোগ
        run: cp cpanel/.cpanel.yml out/.cpanel.yml

      # public/content/ (প্রতিষ্ঠান, তারিখ, তথ্য, নোটিশ, লেখা) সোর্স থেকে তৈরি হয়ে deploy-এ যায়;
      # সোর্স বদলায় CMS (/admin) বা GitHub — তাই সার্ভারে আলাদা এডিট রাখা হয় না।
      - name: deploy ব্রাঞ্চে বিল্ড আউটপুট পুশ
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true
