/* =========================================================================
   BANGLA NUMERALS / DATE FORMAT
   ========================================================================= */
const BN_DIGITS = { "0":"০","1":"১","2":"২","3":"৩","4":"৪","5":"৫","6":"৬","7":"৭","8":"৮","9":"৯" };
function toBanglaNumber(value) { return String(value).replace(/[0-9]/g, (d) => BN_DIGITS[d]); }
const BN_MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
function formatBanglaDate(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split("-").map(Number);
  if (!y || !m || !d) return null;
  return `${toBanglaNumber(d)} ${BN_MONTHS[m - 1]} ${toBanglaNumber(y)}`;
}

/* =========================================================================
   DATE MATH (Asia/Dhaka)
   ========================================================================= */
function getDhakaTodayISO() {
  const formatter = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Dhaka", year: "numeric", month: "2-digit", day: "2-digit" });
  return formatter.format(new Date());
}
function isoToUtcMidnight(iso) { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); }
function diffInDays(a, b) { return Math.round((isoToUtcMidnight(b) - isoToUtcMidnight(a)) / 86400000); }
function isSameDay(a, b) { return a === b; }
function isBefore(a, b) { return isoToUtcMidnight(a) < isoToUtcMidnight(b); }
function isAfter(a, b) { return isoToUtcMidnight(a) > isoToUtcMidnight(b); }
function daysUntil(today, target) { return diffInDays(today, target); }

function useToday() {
  const [today, setToday] = useState(getDhakaTodayISO);
  useEffect(() => {
    const now = new Date();
    const dhakaNow = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Dhaka" }));
    const msUntilMidnight = new Date(dhakaNow.getFullYear(), dhakaNow.getMonth(), dhakaNow.getDate() + 1, 0, 0, 5).getTime() - dhakaNow.getTime();
    const t = setTimeout(() => setToday(getDhakaTodayISO()), Math.max(msUntilMidnight, 1000));
    return () => clearTimeout(t);
  }, [today]);
  return today;
}

   STATUS / COUNTDOWN
   ========================================================================= */
const STATUS_STYLES = {
  "not-started": { labelBn: "আবেদন শুরু হয়নি", className: "bg-slate-100 text-slate-600 border-slate-200" },
  ongoing: { labelBn: "আবেদন চলছে", className: "bg-emerald-100 text-emerald-700 border-emerald-200" },
  "last-day": { labelBn: "আবেদনের শেষ দিন আজ", className: "bg-rose-100 text-rose-700 border-rose-200" },
  closed: { labelBn: "আবেদন শেষ", className: "bg-slate-100 text-slate-600 border-slate-200" },
  "upcoming-exam": { labelBn: "ভর্তি পরীক্ষা আসন্ন", className: "bg-amber-100 text-amber-700 border-amber-200" },
  "exam-today": { labelBn: "আজ ভর্তি পরীক্ষা", className: "bg-gradient-to-r from-rose-600 to-orange-500 text-white border-transparent" },
  completed: { labelBn: "পরীক্ষা সম্পন্ন", className: "bg-slate-100 text-slate-500 border-slate-200" },
  unpublished: { labelBn: "তথ্য প্রকাশিত হয়নি", className: "bg-slate-50 text-slate-400 border-slate-200" },
};
function computeStatus(unit, today) {
  const { applicationStart, applicationEnd, examDate } = unit;
  const build = (status) => ({ status, ...STATUS_STYLES[status] });
  if (!applicationStart && !applicationEnd && !examDate) return build("unpublished");
  if (examDate && isSameDay(today, examDate)) return build("exam-today");
  if (examDate && isAfter(today, examDate)) return build("completed");
  if (applicationEnd && isSameDay(today, applicationEnd)) return build("last-day");
  if (applicationStart && isBefore(today, applicationStart)) return build("not-started");
  if (applicationStart && applicationEnd && !isBefore(today, applicationStart) && isBefore(today, applicationEnd)) return build("ongoing");
  if (applicationEnd && isAfter(today, applicationEnd)) {
    if (examDate) { const d = daysUntil(today, examDate); if (d <= 15) return build("upcoming-exam"); }
    return build("closed");
  }
  if (examDate && isBefore(today, examDate)) return build("upcoming-exam");
  return build("unpublished");
}
function computeCountdown(unit, today) {
  if (!unit.examDate) return { labelBn: "তথ্য প্রকাশিত হয়নি", daysLeft: null, className: "bg-slate-50 text-slate-400 border-slate-200" };
  const daysLeft = daysUntil(today, unit.examDate);
  if (daysLeft < 0) return { labelBn: "পরীক্ষা সম্পন্ন", daysLeft, className: "bg-slate-100 text-slate-500 border-slate-200" };
  if (daysLeft === 0) return { labelBn: "আজ পরীক্ষা", daysLeft, className: "bg-gradient-to-r from-rose-600 to-orange-500 text-white border-transparent font-bold" };
  if (daysLeft === 1) return { labelBn: "আগামীকাল", daysLeft, className: "bg-rose-100 text-rose-700 border-rose-200 font-bold" };
  const label = `আর ${toBanglaNumber(daysLeft)} দিন`;
  if (daysLeft < 7) return { labelBn: label, daysLeft, className: "bg-rose-50 text-rose-700 border-rose-200" };
  if (daysLeft < 15) return { labelBn: label, daysLeft, className: "bg-amber-50 text-amber-700 border-amber-200" };
  return { labelBn: label, daysLeft, className: "bg-sky-50 text-sky-700 border-sky-200" };
}
function computeDeadlineDaysLeft(unit, today) {
  if (!unit.applicationEnd) return null;
  return daysUntil(today, unit.applicationEnd);
}

   ========================================================================= */
function flattenUnits(list) {
  const rows = [];
  for (const university of list) for (const unit of university.units) rows.push({ university, unit });
  return rows;
}
function computeSummaryStats(list, rows, today) {
  let ongoingCount = 0, upcomingExamCount = 0, examsThisWeekCount = 0;
  for (const { unit } of rows) {
    const { status } = computeStatus(unit, today);
    if (status === "ongoing" || status === "last-day") ongoingCount++;
    if (status === "upcoming-exam" || status === "exam-today") upcomingExamCount++;
    if (unit.examDate) { const d = daysUntil(today, unit.examDate); if (d >= 0 && d <= 7) examsThisWeekCount++; }
  }
  return { totalInstitutions: list.length, ongoingCount, upcomingExamCount, examsThisWeekCount };
}
function getUpcomingExams(rows, today, limit) {
  return rows.filter((r) => r.unit.examDate && daysUntil(today, r.unit.examDate) >= 0)
    .sort((a, b) => daysUntil(today, a.unit.examDate) - daysUntil(today, b.unit.examDate)).slice(0, limit);
}
function getUrgentDeadlines(rows, today, withinDays) {
  return rows.filter((r) => { const d = computeDeadlineDaysLeft(r.unit, today); return d !== null && d >= 0 && d <= withinDays; })
    .sort((a, b) => computeDeadlineDaysLeft(a.unit, today) - computeDeadlineDaysLeft(b.unit, today));
}
function searchRows(rows, query) {
  const q = query.trim().toLowerCase();
  if (!q) return rows;
  return rows.filter(({ university, unit }) => {
    const category = getCategoryById(university.category);
    const hay = [university.nameBn, university.nameEn, university.shortName, unit.nameBn || "", category?.nameBn || "", category?.shortNameBn || ""].join(" ").toLowerCase();
    return hay.includes(q);
  });
}
function filterByStatus(rows, filter, today) {
  if (filter === "all") return rows;
  return rows.filter((r) => {
    const { status } = computeStatus(r.unit, today);
    if (filter === "ongoing") return status === "ongoing" || status === "last-day";
    if (filter === "upcoming-exam") return status === "upcoming-exam" || status === "exam-today";
    if (filter === "closed") return status === "closed";
    if (filter === "completed") return status === "completed";
    return true;
  });
}
function dayRank(daysLeft) { if (daysLeft === null) return Infinity; if (daysLeft >= 0) return daysLeft; return 100000 - daysLeft; }
function sortRows(rows, key, today) {
  const sorted = [...rows];
  if (key === "name") { sorted.sort((a, b) => a.university.nameBn.localeCompare(b.university.nameBn, "bn")); return sorted; }
  if (key === "application-deadline") { sorted.sort((a, b) => dayRank(computeDeadlineDaysLeft(a.unit, today)) - dayRank(computeDeadlineDaysLeft(b.unit, today))); return sorted; }
  sorted.sort((a, b) => {
    const da = a.unit.examDate ? daysUntil(today, a.unit.examDate) : null;
    const db = b.unit.examDate ? daysUntil(today, b.unit.examDate) : null;
    return dayRank(da) - dayRank(db);
  });
  return sorted;
}

const CHECKER_SUBJECTS = ["পদার্থবিজ্ঞান", "রসায়ন", "জীববিজ্ঞান", "উচ্চতর গণিত", "ইংরেজি"];
const GROUP_OPTIONS = [
  { value: "science", labelKey: "groupScience" },
  { value: "commerce", labelKey: "groupCommerce" },
  { value: "arts", labelKey: "groupArts" },
];

function isEligibleForUnit(criteria, input) {
  if (criteria.group !== "any" && criteria.group !== input.group) return false;
  if (criteria.minSscGpa != null && input.sscGpa < criteria.minSscGpa) return false;
  if (criteria.minHscGpa != null && input.hscGpa < criteria.minHscGpa) return false;
  if (criteria.minCombinedGpa != null && input.sscGpa + input.hscGpa < criteria.minCombinedGpa) return false;
  for (const req of criteria.subjectMinimums || []) {
    const value = input.subjectGpas[req.subjectBn];
    if (value == null || value < req.minGpa) return false;
  }
  if (criteria.subjectGroupMinTotal) {
    const { subjectsBn, minTotal } = criteria.subjectGroupMinTotal;
    let total = 0;
    for (const subject of subjectsBn) {
      const value = input.subjectGpas[subject];
      if (value == null) return false;
      total += value;
    }
    if (total < minTotal) return false;
  }
  return true;
}
function findEligibleUnits(list, input) {
  const results = [];
  for (const university of list) {
    for (const unit of university.units) {
      const criteria = unit.eligibilityCriteria;
      if (!criteria) continue;
      if (isEligibleForUnit(criteria, input)) results.push({ university, unit, criteria });
    }
  }
  return results;
}
function formatCriteriaSummary(criteria) {
  const lines = [];
  if (criteria.minSscGpa != null) lines.push(`SSC জিপিএ ≥ ${criteria.minSscGpa}`);
  if (criteria.minHscGpa != null) lines.push(`HSC জিপিএ ≥ ${criteria.minHscGpa}`);
  if (criteria.minCombinedGpa != null) lines.push(`মোট (SSC+HSC) জিপিএ ≥ ${criteria.minCombinedGpa}`);
  for (const req of criteria.subjectMinimums || []) lines.push(`${req.subjectBn} জিপিএ ≥ ${req.minGpa}`);
  if (criteria.subjectGroupMinTotal) lines.push(`${criteria.subjectGroupMinTotal.subjectsBn.join(" + ")} মিলিয়ে ≥ ${criteria.subjectGroupMinTotal.minTotal}`);
  return lines;
}

const checkerInputClass = "w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-base font-bold text-navy-900 focus:border-purple-400 focus:ring-2 focus:ring-purple-100";
const CHECKER_CURRENT_YEAR = new Date().getFullYear();

function EligibilityChecker({ onOpenUniversity }) {
  const [group, setGroup] = useState("science");
  const [sscGpa, setSscGpa] = useState("");
  const [hscGpa, setHscGpa] = useState("");
  const [subjectGpas, setSubjectGpas] = useState({});
  const [sscYear, setSscYear] = useState("");
  const [hscYear, setHscYear] = useState("");
  const [mobileNumber, setMobileNumber] = useState("");
  const [submittedInput, setSubmittedInput] = useState(null);

  const results = useMemo(() => (submittedInput ? findEligibleUnits(universities, submittedInput) : []), [submittedInput]);
  const resultsByCategory = useMemo(() => {
    const map = new Map();
    for (const row of results) {
      const list = map.get(row.university.category) || [];
      list.push(row);
      map.set(row.university.category, list);
    }
    return map;
  }, [results]);

  const handleSubmit = (e) => {
    e.preventDefault();
    const parsedSubjects = {};
    for (const subject of CHECKER_SUBJECTS) {
      const raw = subjectGpas[subject];
      if (raw && raw.trim() !== "") {
        const n = Number(raw);
        if (!Number.isNaN(n)) parsedSubjects[subject] = n;
      }
    }
    setSubmittedInput({ group, sscGpa: Number(sscGpa) || 0, hscGpa: Number(hscGpa) || 0, subjectGpas: parsedSubjects, sscYear: Number(sscYear) || 0, hscYear: Number(hscYear) || 0, mobileNumber });
  };

  return (
    <div className="space-y-5">
      <div className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-soft">
        <div className="bg-purple-600 px-4 py-4 sm:px-6">
          <h2 className="flex items-center gap-2 text-lg font-extrabold text-white sm:text-xl"><IconClipboardCheck className="h-5 w-5" />{texts.checkerTitle}</h2>
          <p className="mt-1 text-sm font-semibold text-purple-100">{texts.checkerSubtitle}</p>
        </div>
        <form onSubmit={handleSubmit} className="space-y-4 p-4 sm:p-6">
          <div>
            <p className="mb-2 text-sm font-bold text-navy-900">{texts.groupLabel}</p>
            <div className="flex flex-wrap gap-2">
              {GROUP_OPTIONS.map((opt) => (
                <button key={opt.value} type="button" onClick={() => setGroup(opt.value)}
                  className={`rounded-full border px-4 py-2 text-sm font-bold transition-colors ${group === opt.value ? "border-purple-600 bg-purple-600 text-white" : "border-slate-200 bg-white text-slate-600 hover:bg-slate-50"}`}>
                  {texts[opt.labelKey]}
                </button>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <label className="block">
              <span className="mb-1.5 block text-sm font-bold text-navy-900">{texts.sscGpaLabel}</span>
              <input required type="number" min={0} max={5} step={0.01} placeholder={texts.gpaPlaceholder} value={sscGpa} onChange={(e) => setSscGpa(e.target.value)} className={checkerInputClass} />
            </label>
            <label className="block">
              <span className="mb-1.5 block text-sm font-bold text-navy-900">{texts.hscGpaLabel}</span>
              <input required type="number" min={0} max={5} step={0.01} placeholder={texts.gpaPlaceholder} value={hscGpa} onChange={(e) => setHscGpa(e.target.value)} className={checkerInputClass} />
            </label>
          </div>
          {group === "science" && (
            <div>
              <p className="mb-2 text-sm font-bold text-navy-900">{texts.subjectGpaLabel}</p>
              <div className="grid grid-cols-2 gap-3 sm:grid-cols-3">
                {CHECKER_SUBJECTS.map((subject) => (
                  <label key={subject} className="block">
                    <span className="mb-1.5 block text-xs font-bold text-slate-500">{subject}</span>
                    <input type="number" min={0} max={5} step={0.01} value={subjectGpas[subject] || ""} onChange={(e) => setSubjectGpas((prev) => ({ ...prev, [subject]: e.target.value }))} className={checkerInputClass} />
                  </label>
                ))}
              </div>
            </div>
          )}
          <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <label className="block">
              <span className="mb-1.5 block text-sm font-bold text-navy-900">{texts.sscYearLabel}</span>
              <input required type="number" min={2005} max={CHECKER_CURRENT_YEAR} step={1} placeholder={fillTemplate(texts.yearPlaceholder, { year: String(CHECKER_CURRENT_YEAR - 2) })} value={sscYear} onChange={(e) => setSscYear(e.target.value)} className={checkerInputClass} />
            </label>
            <label className="block">
              <span className="mb-1.5 block text-sm font-bold text-navy-900">{texts.hscYearLabel}</span>
              <input required type="number" min={2005} max={CHECKER_CURRENT_YEAR} step={1} placeholder={fillTemplate(texts.yearPlaceholder, { year: String(CHECKER_CURRENT_YEAR) })} value={hscYear} onChange={(e) => setHscYear(e.target.value)} className={checkerInputClass} />
            </label>
          </div>
          <label className="block">
            <span className="mb-1.5 block text-sm font-bold text-navy-900">{texts.mobileLabel}</span>
            <input required type="tel" inputMode="numeric" pattern="01[3-9][0-9]{8}" maxLength={11} placeholder={texts.mobilePlaceholder} value={mobileNumber} onChange={(e) => setMobileNumber(e.target.value.replace(/[^0-9]/g, ""))} className={checkerInputClass} />
          </label>
          <button type="submit" className="flex w-full items-center justify-center gap-2 rounded-lg bg-purple-600 py-3 text-base font-extrabold text-white shadow-soft transition-opacity hover:opacity-90"><IconCheckCircle className="h-5 w-5" />{texts.checkButton}</button>
        </form>
      </div>
      {submittedInput && <EligibilityResults resultsByCategory={resultsByCategory} totalCount={results.length} onOpenUniversity={onOpenUniversity} />}
      <p className="text-center text-xs font-semibold text-slate-400">{texts.checkerDisclaimer}</p>
    </div>
  );
}

   APP

const bundledById = new Map(universities.map((u) => [u.id, u]));
function buildUniversity(raw, info, elig) {
  const id = raw.id;
  const bundled = bundledById.get(id);
  const infoUni = info ? info[id] : null;
  const eligUni = elig ? elig[id] : null;
  const units = raw.units.map((rawUnit) => {
    const unitId = rawUnit.id;
    const bundledUnit = bundled ? bundled.units.find((x) => x.id === unitId) : null;
    const infoUnit = infoUni && infoUni.units ? infoUni.units[unitId] : null;
    const ui = infoUnit || bundledUnit || {};
    const criteria = eligUni && unitId in eligUni ? eligUni[unitId] : (bundledUnit ? bundledUnit.eligibilityCriteria : null) ?? null;
    return {
      id: unitId,
      nameBn: rawUnit.nameBn ?? null,
      applicationStart: rawUnit.applicationStart ?? null,
      applicationEnd: rawUnit.applicationEnd ?? null,
      examDate: rawUnit.examDate ?? null,
      isDemoData: !!rawUnit.isDemoData,
      seats: ui.seats ?? null,
      eligibility: ui.eligibility ?? null,
      examPattern: ui.examPattern ?? null,
      subjects: ui.subjects ?? [],
      resultMethod: ui.resultMethod ?? null,
      circularUrl: ui.circularUrl ?? null,
      eligibilityCriteria: criteria,
    };
  });
  const introSource = infoUni ? infoUni.introBn : (bundled ? bundled.introBn : undefined);
  return {
    id,
    nameBn: raw.nameBn,
    nameEn: raw.nameEn ?? (bundled ? bundled.nameEn : ""),
    shortName: raw.shortName,
    category: raw.category,
    subGroupBn: raw.subGroupBn ?? (bundled ? bundled.subGroupBn : undefined),
    admissionSession: raw.admissionSession ?? (bundled ? bundled.admissionSession : ""),
    introBn: introSource ?? undefined,
    units,
  };
}
function applyContent(files) {
  let changed = false;
  const isObj = (v) => !!v && typeof v === "object" && !Array.isArray(v);
  const isAdmissionUni = (u) => u && typeof u.id === "string" && typeof u.nameBn === "string" && typeof u.shortName === "string" && typeof u.category === "string" && Array.isArray(u.units) && u.units.length > 0 && u.units.every((x) => x && typeof x.id === "string");
  const adm = files.admissions;
  if (isObj(adm) && Array.isArray(adm.universities) && adm.universities.length > 0 && adm.universities.every(isAdmissionUni)) {
    const info = isObj(files.info) ? files.info : null;
    const elig = isObj(files.eligibility) ? files.eligibility : null;
    const merged = adm.universities.map((u) => buildUniversity(u, info, elig));
    universities.splice(0, universities.length, ...merged);
    changed = true;
  }
  const noticeList = Array.isArray(files.notices) ? files.notices : (files.notices && files.notices.notices);
  if (Array.isArray(noticeList) && noticeList.every((n) => typeof n === "string")) {
    NOTICES.splice(0, NOTICES.length, ...noticeList);
    changed = true;
  }
  if (isObj(files.texts)) {
    for (const key of Object.keys(texts)) {
      const value = files.texts[key];
      if (typeof value === "string" && value.trim() !== "") { texts[key] = value; changed = true; }
    }
  }
  return changed;
}
function ContentProvider({ children }) {
  const [version, setVersion] = useState(0);
  useEffect(() => {
    let cancelled = false;
    const names = ["admissions", "info", "eligibility", "notices", "site-texts"];
    Promise.all(names.map((n) => fetch("content/" + n + ".json?t=" + Date.now(), { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null)))
      .then(([admissions, info, eligibility, notices, siteTexts]) => {
        const changed = applyContent({ admissions, info, eligibility, notices, texts: siteTexts });
        document.title = texts.pageTitle;
        if (!cancelled && changed) setVersion((v) => v + 1);
      });
    return () => { cancelled = true; };
  }, []);
  return <React.Fragment key={version}>{children}</React.Fragment>;
}
function App() {
  const [activeTab, setActiveTab] = useState("overview");
  const [jumpToUniversityId, setJumpToUniversityId] = useState(null);
  const openUniversityInInfoTab = (id) => { setJumpToUniversityId(id); setActiveTab("info"); };
  // Tab switches replace the whole panel below the sticky nav, so always
  // reset scroll to top — otherwise a switch triggered from far down a long
  // list (e.g. a table row's texts.details button) leaves new content hidden
  // underneath the sticky header/tabs bar.
  useEffect(() => { window.scrollTo(0, 0); }, [activeTab]);
  return (
    <div className="flex min-h-screen flex-col">
      <Header />
      <MainTabs active={activeTab} onChange={setActiveTab} />
      <main className="mx-auto w-full max-w-7xl flex-1 px-4 py-5 sm:px-6 sm:py-6">
        {activeTab === "overview" && <CalendarTab onOpenUniversity={openUniversityInInfoTab} />}
        {activeTab === "info" && <InfoTab jumpToUniversityId={jumpToUniversityId} onConsumeJump={() => setJumpToUniversityId(null)} />}
        {activeTab === "eligibility" && <EligibilityChecker onOpenUniversity={openUniversityInInfoTab} />}
      </main>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ContentProvider><App /></ContentProvider>);
